name: 'Checkout'
description: 'Checkout a Git repository at a particular version'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "🚨 IMPOSTER COMMIT: this is not actions/checkout."
        echo "This commit lives only in a fork (nodeselector/checkout-describe-fork),"
        echo "but GitHub served it as actions/checkout@<sha> because forks share objects."
        echo "A real attacker would steal secrets here. (Ignite BRK286 demo: benign.)"
